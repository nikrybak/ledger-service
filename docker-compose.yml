services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ledger -d ledger']
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ['node', 'dist/migrate.js']
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      STORAGE: postgres
      DATABASE_URL: postgres://ledger:ledger@postgres:5432/ledger
      LOG_LEVEL: info
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
